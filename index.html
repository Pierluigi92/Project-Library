        <h1>My Library</h1>
    </div>
   </header>
   <main>
        <button class="btn-add-book">+ Add book</button>
        <div class="books-contain">
        </div>
        <dialog>
            <button type="button" class="btn-close-dialog" aria-label="Close">x</button>
            <form action="">
                <label for="title">Title:</label>
                <input type="text" name="title" id="title" required>

                <label for="author">Author:</label>
                <input type="text" name="author" id="author">

                <label for="pages">Pages:</label>
                <input type="number" name="pages" id="pages">

                <div class="read-option">
                    <label for="yes">Read:</label>
                    <input type="radio" id="yes" name="read" value="Read">
                </div>
                <div class="read-option">
                    <label for="no">Unread:</label>
                    <input type="radio" id="no" name="read" value="Unread" checked>
                </div>

                <button type="submit" class="dialog-add-book">Add book</button>
            </form>
        </dialog>
   </main>
</body>
